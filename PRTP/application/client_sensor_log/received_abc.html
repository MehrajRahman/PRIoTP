<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="mgmtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="scaleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="secGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="500" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Enhanced Universal IoT Middleware Architecture</text>
  
  <!-- Left Side - IoT Protocols -->
  <g id="iot-protocols">
    <rect x="50" y="80" width="150" height="480" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">IoT Protocols</text>
    
    <!-- Protocol Circles -->
    <circle cx="90" cy="140" r="25" fill="#06b6d4"/>
    <text x="90" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">CoAP</text>
    
    <circle cx="160" cy="140" r="25" fill="#3b82f6"/>
    <text x="160" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Zigbee</text>
    
    <circle cx="90" cy="200" r="25" fill="#8b5cf6"/>
    <text x="90" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">MQTT</text>
    
    <circle cx="160" cy="200" r="25" fill="#10b981"/>
    <text x="160" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">LoRaWAN</text>
    
    <circle cx="90" cy="260" r="25" fill="#f59e0b"/>
    <text x="90" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">WebSocket</text>
    
    <circle cx="160" cy="260" r="25" fill="#ef4444"/>
    <text x="160" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">HTTP</text>
    
    <circle cx="125" cy="320" r="25" fill="#6366f1"/>
    <text x="125" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Modbus</text>
    
    <!-- Protocol Adapter Layer -->
    <rect x="60" y="360" width="130" height="30" rx="5" fill="#1e293b" opacity="0.8"/>
    <text x="125" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Protocol Adapters</text>
    
    <!-- Data Normalization -->
    <rect x="60" y="400" width="130" height="30" rx="5" fill="#475569" opacity="0.8"/>
    <text x="125" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Data Normalization</text>
    
    <!-- Message Queue -->
    <rect x="60" y="440" width="130" height="30" rx="5" fill="#64748b" opacity="0.8"/>
    <text x="125" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Message Queue</text>
    
    <!-- Connection Status -->
    <circle cx="180" cy="520" r="8" fill="#10b981"/>
    <text x="195" y="526" font-family="Arial, sans-serif" font-size="10" fill="#10b981">Active: 6/7</text>
  </g>
  
  <!-- Arrows from IoT to Middleware -->
  <path d="M 200 300 L 240 300" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="220" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Data Flow</text>
  
  <!-- Central Middleware -->
  <g id="middleware">
    <rect x="250" y="80" width="320" height="570" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="3" filter="url(#shadow)"/>
    <rect x="250" y="80" width="320" height="50" rx="10" fill="#3b82f6"/>
    <text x="410" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">Universal IoT Middleware</text>
    <text x="410" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Protocol-Agnostic Layer</text>
    
    <!-- API/Interface Layer -->
    <rect x="270" y="150" width="280" height="45" rx="8" fill="url(#apiGradient)" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="290" cy="172" r="12" fill="#3b82f6"/>
    <rect x="285" y="167" width="10" height="10" rx="2" fill="white"/>
    <text x="315" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">API Gateway & Request Router</text>
    <text x="315" y="186" font-family="Arial, sans-serif" font-size="9" fill="#64748b">REST/GraphQL • Rate Limiting • Load Balancing</text>
    
    <!-- Sub-components -->
    <rect x="430" y="162" width="50" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
    <text x="455" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1e293b">Auth</text>
    <rect x="485" y="162" width="50" height="12" rx="2" fill="#3b82f6" opacity="0.3"/>
    <text x="510" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#1e293b">Validation</text>
    
    <!-- Data Processing & Analytics -->
    <rect x="270" y="210" width="280" height="45" rx="8" fill="url(#dataGradient)" stroke="#10b981" stroke-width="2"/>
    <circle cx="290" cy="232" r="12" fill="#10b981"/>
    <text x="287" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📊</text>
    <text x="315" y="237" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Data Processing & Analytics</text>
    <text x="315" y="248" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Real-time processing, aggregation, ML inference</text>
    
    <!-- Management & Monitoring -->
    <rect x="270" y="270" width="280" height="45" rx="8" fill="url(#mgmtGradient)" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="290" cy="292" r="12" fill="#8b5cf6"/>
    <text x="287" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">⚙️</text>
    <text x="315" y="297" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Device Management & Monitoring</text>
    <text x="315" y="308" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Health checks, configuration, firmware updates</text>
    
    <!-- Scalability & Load Balancing -->
    <rect x="270" y="330" width="280" height="45" rx="8" fill="url(#scaleGradient)" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="290" cy="352" r="12" fill="#f59e0b"/>
    <text x="287" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">⚡</text>
    <text x="315" y="357" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Auto-Scaling & Load Balancing</text>
    <text x="315" y="368" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Dynamic resource allocation, failover</text>
    
    <!-- Security & Authentication -->
    <rect x="270" y="390" width="280" height="45" rx="8" fill="url(#secGradient)" stroke="#ef4444" stroke-width="2"/>
    <circle cx="290" cy="412" r="12" fill="#ef4444"/>
    <text x="287" y="417" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔒</text>
    <text x="315" y="417" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Security & Authentication</text>
    <text x="315" y="428" font-family="Arial, sans-serif" font-size="10" fill="#64748b">OAuth 2.0, JWT, TLS encryption, rate limiting</text>
    
    <!-- Message Broker & Event Bus -->
    <rect x="270" y="450" width="280" height="45" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="290" cy="472" r="12" fill="#64748b"/>
    <text x="287" y="477" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🔄</text>
    <text x="315" y="477" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Message Broker & Event Bus</text>
    <text x="315" y="488" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Kafka, RabbitMQ, pub/sub patterns</text>
    
    <!-- State Management Layer -->
    <rect x="270" y="510" width="280" height="45" rx="8" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="2"/>
    <circle cx="290" cy="532" r="12" fill="#6366f1"/>
    <text x="287" y="537" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📋</text>
    <text x="315" y="537" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">State Management & Tables</text>
    <text x="315" y="548" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Device states, protocol FSM, session tracking</text>
    
    <!-- Data Storage Layer -->
    <rect x="270" y="560" width="280" height="30" rx="8" fill="#1e293b" opacity="0.1" stroke="#1e293b" stroke-width="2"/>
    <circle cx="290" cy="575" r="10" fill="#1e293b"/>
    <text x="285" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">💾</text>
    <text x="315" y="580" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Data Storage & Caching</text>
  </g>
  
  <!-- Right Side - External Systems -->
  <g id="external-systems">
    <rect x="600" y="80" width="150" height="280" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
    <text x="675" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">External Systems</text>
    
    <!-- Cloud Services -->
    <rect x="620" y="120" width="110" height="35" rx="5" fill="#3b82f6" opacity="0.8"/>
    <text x="675" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Cloud Services</text>
    
    <!-- Enterprise Systems -->
    <rect x="620" y="165" width="110" height="35" rx="5" fill="#8b5cf6" opacity="0.8"/>
    <text x="675" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">ERP/CRM</text>
    
    <!-- Analytics Platforms -->
    <rect x="620" y="210" width="110" height="35" rx="5" fill="#10b981" opacity="0.8"/>
    <text x="675" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Analytics</text>
    
    <!-- Third-party APIs -->
    <rect x="620" y="255" width="110" height="35" rx="5" fill="#f59e0b" opacity="0.8"/>
    <text x="675" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">3rd Party APIs</text>
    
    <!-- Mobile Apps -->
    <rect x="620" y="300" width="110" height="35" rx="5" fill="#ef4444" opacity="0.8"/>
    <text x="675" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Mobile/Web Apps</text>
  </g>
  
  <!-- Network Protocols -->
  <g id="network-protocols">
    <rect x="800" y="80" width="120" height="280" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
    <text x="860" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Network Layer</text>
    
    <circle cx="860" cy="140" r="20" fill="#64748b"/>
    <text x="860" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">TCP</text>
    
    <circle cx="860" cy="180" r="20" fill="#64748b"/>
    <text x="860" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">UDP</text>
    
    <circle cx="860" cy="220" r="20" fill="#64748b"/>
    <text x="860" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">SCTP</text>
    
    <circle cx="860" cy="260" r="20" fill="#64748b"/>
    <text x="860" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">HTTP/3</text>
    
    <circle cx="860" cy="300" r="20" fill="#64748b"/>
    <text x="860" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">WebRTC</text>
  </g>
  
  <!-- Arrows from Middleware to External -->
  <path d="M 570 220 L 600 220" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="585" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">API</text>
  
  <!-- Arrows to Network -->
  <path d="M 750 220 L 800 220" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback/Control Loops -->
  <path d="M 600 300 Q 580 350 250 350" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="425" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f59e0b">Control & Feedback Loop</text>
  
  <path d="M 800 300 Q 780 400 570 400" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="685" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#ef4444">Network Feedback</text>
  
  <!-- Performance Metrics -->
  <g id="metrics">
    <rect x="250" y="670" width="320" height="60" rx="10" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
    <text x="410" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Performance Metrics</text>
    
    <text x="270" y="705" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Throughput: 10K msg/sec</text>
    <text x="270" y="717" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Latency: &lt;50ms avg</text>
    
    <text x="410" y="705" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Uptime: 99.9%</text>
    <text x="410" y="717" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Active Devices: 50K+</text>
    
    <text x="480" y="705" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Memory: 2.1GB/8GB</text>
    <text x="480" y="717" font-family="Arial, sans-serif" font-size="10" fill="#64748b">CPU: 35% avg</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
